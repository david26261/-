name: Windows RDP via Tailscale (B)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode"
        required: false
        default: "false"
      runtime_minutes:
        description: "Runtime in minutes"
        required: false
        default: "355"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  RDP_USER: Bullettemporary
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: Validate Secrets
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
            throw "Missing RDP_PASS secret"
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_API_KEY)) {
            throw "Missing TS_API_KEY secret"
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing TS_AUTHKEY secret"
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_API_TOKEN)) {
            throw "Missing GH_API_TOKEN secret"
          }

          Write-Host "All required secrets are available."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: Configure Windows RDP
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS

          $secure = ConvertTo-SecureString `
            $pass `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $user `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser `
              -Name $user `
              -Password $secure
          }
          else {
            New-LocalUser `
              -Name $user `
              -Password $secure `
              -PasswordNeverExpires `
              -UserMayNotChangePassword
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $user `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $user `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

          Write-Host "Windows RDP configured successfully."

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="$env:TS_HOSTNAME" `
            --accept-routes `
            --accept-dns=false

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "===== TAILSCALE STATUS ====="
          & $ts status

          Write-Host ""
          Write-Host "===== TAILSCALE IPv4 ====="
          & $ts ip -4

      - name: Test RDP availability
        shell: powershell
        run: |
          Write-Host "Testing local RDP port 3389..."

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw "RDP port 3389 is NOT open."
          }

          Write-Host "RDP port 3389 is OPEN."

      - name: Show RDP information
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (
            & $ts ip -4 |
            Select-Object -First 1
          ).Trim()

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "RDP USER: $env:RDP_USER"
          Write-Host "TAILSCALE IP: $ip"
          Write-Host "HOSTNAME: $env:TS_HOSTNAME"
          Write-Host "=========================================="

          Add-Content `
            $env:GITHUB_STEP_SUMMARY `
            "### Windows RDP via Tailscale (B)"

          Add-Content `
            $env:GITHUB_STEP_SUMMARY `
            ""

          Add-Content `
            $env:GITHUB_STEP_SUMMARY `
            "Tailscale IP: **$ip**"

          Add-Content `
            $env:GITHUB_STEP_SUMMARY `
            "Hostname: **$env:TS_HOSTNAME**"

          Add-Content `
            $env:GITHUB_STEP_SUMMARY `
            "RDP User: **$env:RDP_USER**"

      - name: Keep RDP alive
        shell: powershell
        run: |
          $runtime = [int]"${{ inputs.runtime_minutes }}"

          if ($runtime -lt 1) {
            $runtime = 355
          }

          if ($runtime -gt 355) {
            $runtime = 355
          }

          Write-Host "Keeping RDP alive for $runtime minutes..."

          $end = (Get-Date).AddMinutes($runtime)

          while ((Get-Date) -lt $end) {
            Write-Host "$(Get-Date) - RDP is alive"
            Start-Sleep -Seconds 30
          }

          Write-Host "Runtime finished."

      - name: Start workflow A
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"

          $body = @{
            ref = "main"
            inputs = @{
              test_mode = "${{ inputs.test_mode }}"
              runtime_minutes = "${{ inputs.runtime_minutes }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Method POST `
            -Uri "https://api.github.com/repos/$repo/actions/workflows/windows-rdp-tailscale-A.yml/dispatches" `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -Body $body `
            -ContentType "application/json"

          Write-Host "Workflow A dispatched successfully."
