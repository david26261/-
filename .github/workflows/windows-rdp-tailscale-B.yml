name: Windows RDP via Tailscale (B)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode"
        required: false
        default: "false"

      runtime_minutes:
        description: "Runtime in minutes"
        required: false
        default: "300"

      loops:
        description: "Number of A+B cycles"
        required: false
        default: "2"

      enable_backup:
        description: "Enable Auto Backup & Restore"
        type: choice
        options:
          - "true"
          - "false"
        required: false
        default: "true"

      prev_run_id:
        description: "Previous Run ID for automatic restore (Leave empty)"
        required: false
        default: ""

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  RDP_USER: Bullettemporary
  TS_HOSTNAME: bullet
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: Validate Secrets
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) { throw "Missing RDP_PASS secret" }
          if ([string]::IsNullOrWhiteSpace($env:TS_API_KEY)) { throw "Missing TS_API_KEY secret" }
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw "Missing TS_AUTHKEY secret" }
          if ([string]::IsNullOrWhiteSpace($env:GH_API_TOKEN)) { throw "Missing GH_API_TOKEN secret" }
          # v8: anchor the session clock to JOB start (used by Keep RDP alive)
          (Get-Date).ToString("o") | Out-File -FilePath "C:\job_start.txt" -Encoding ascii

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5

      - name: Configure Windows RDP
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS
          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if ($existing) {
            Set-LocalUser -Name $user -Password $secure
          } else {
            New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -UserMayNotChangePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      - name: Download Backup from Previous Session
        if: ${{ inputs.enable_backup == 'true' && inputs.prev_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: session-backup
          path: C:\RestoredBackup
          github-token: ${{ secrets.GH_API_TOKEN }}
          run-id: ${{ inputs.prev_run_id }}

      - name: Extract Restored Files to User Profile
        if: ${{ inputs.enable_backup == 'true' && inputs.prev_run_id != '' }}
        shell: powershell
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        continue-on-error: true
        run: |
          $zip = "C:\RestoredBackup\backup_output.7z"
          if (-not (Test-Path $zip)) { Write-Host "No backup archive was downloaded - nothing to restore"; exit 0 }
          Write-Host "Backup archive size: $((Get-Item $zip).Length) bytes"
          New-Item -ItemType Directory -Force -Path "C:\RestoredBackup\extracted" | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:BACKUP_PASS)) { Write-Host "ERROR: BACKUP_PASS secret is not set - cannot decrypt the backup"; exit 0 }
          & "C:\Program Files\7-Zip\7z.exe" x "$zip" -o"C:\RestoredBackup\extracted" -y -p"$env:BACKUP_PASS"
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: backup extraction failed - wrong BACKUP_PASS?"; exit 0 }
          $restoredCount = (Get-ChildItem "C:\RestoredBackup\extracted" -Recurse -File | Measure-Object).Count
          Write-Host "Restored $restoredCount files from the encrypted backup"
          Add-Content $env:GITHUB_STEP_SUMMARY "### Restored files"
          Add-Content $env:GITHUB_STEP_SUMMARY "$restoredCount files restored (names hidden in v9)"
          # Immediate copy into the expected profile folder
          $srcProfile = Get-ChildItem "C:\RestoredBackup\extracted" -Directory | Select-Object -First 1
          if ($srcProfile) {
            Copy-Item "$($srcProfile.FullName)" "C:\Users\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          # Guarantee: a logon task copies the files into the REAL profile of the RDP user
          # (Windows may create the profile as Bullettemporary.<name> on first logon)
          $restoreScript = @'
          $src = Get-ChildItem "C:\RestoredBackup\extracted" -Directory | Select-Object -First 1
          if ($src) {
            foreach ($f in @("Desktop", "Downloads", "Documents")) {
              if (Test-Path "$($src.FullName)\$f") {
                New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\$f" | Out-Null
                Copy-Item "$($src.FullName)\$f\*" "$env:USERPROFILE\$f\" -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
          }
          '@
          Set-Content "C:\RestoredBackup\apply-restore.ps1" $restoreScript
          try {
            $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -File C:\RestoredBackup\apply-restore.ps1"
            $trigger = New-ScheduledTaskTrigger -AtLogOn -User $env:RDP_USER
            $principal = New-ScheduledTaskPrincipal -UserId $env:RDP_USER -RunLevel Highest
            Register-ScheduledTask -TaskName "ApplyRestoredFiles" -Action $action -Trigger $trigger -Principal $principal -Force | Out-Null
            Write-Host "Logon restore task registered for $env:RDP_USER"
          } catch { Write-Host "WARNING: could not register logon restore task: $_" }

      - name: Install WinRAR
        shell: powershell
        continue-on-error: true
        timeout-minutes: 5
        run: |
          function New-DeskShortcut($exe, $name) {
            foreach ($desk in @("C:\Users\Public\Desktop", "C:\Users\$env:RDP_USER\Desktop")) {
              if (Test-Path $desk) {
                $s = New-Object -ComObject WScript.Shell
                $lnk = $s.CreateShortcut("$desk\$name.lnk")
                $lnk.TargetPath = $exe
                $lnk.Save()
                Write-Host "Shortcut created: $desk\$name.lnk"
              }
            }
          }
          Write-Host "Installing WinRAR (direct download, silent)..."
          $wr = "$env:TEMP\winrar-setup.exe"
          curl.exe -L -f -s --connect-timeout 20 --max-time 120 --retry 2 "https://www.win-rar.com/fileadmin/winrar-versions/winrar-x64-723.exe" -o "$wr"
          if ((Test-Path $wr) -and ((Get-Item $wr).Length -gt 2MB)) {
            Start-Process -FilePath $wr -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path "C:\Program Files\WinRAR\WinRAR.exe")) {
            Write-Host "Direct install did not produce WinRAR.exe - trying winget..."
            winget install --id RARLab.WinRAR -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          if (Test-Path "C:\Program Files\WinRAR\WinRAR.exe") {
            New-DeskShortcut "C:\Program Files\WinRAR\WinRAR.exe" "WinRAR"
            Write-Host "WinRAR OK"
          } else {
            Write-Host "WARNING: WinRAR.exe still not found"
          }

      - name: Install Telegram Desktop
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          function New-DeskShortcut($exe, $name) {
            foreach ($desk in @("C:\Users\Public\Desktop", "C:\Users\$env:RDP_USER\Desktop")) {
              if (Test-Path $desk) {
                $s = New-Object -ComObject WScript.Shell
                $lnk = $s.CreateShortcut("$desk\$name.lnk")
                $lnk.TargetPath = $exe
                $lnk.Save()
                Write-Host "Shortcut created: $desk\$name.lnk"
              }
            }
          }
          $tgZip = "$env:TEMP\telegram-portable.zip"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          # v6 lesson: a 25 MB truncated zip passed the old ">20MB" check and
          # 7-Zip then extracted a corrupt Telegram.exe. Now every download is
          # proven complete (exact GitHub asset size when known + 7-Zip
          # integrity test) before anything is extracted.
          function Test-TgZip {
            if (-not (Test-Path $tgZip)) { return $false }
            if ((Get-Item $tgZip).Length -lt 60MB) { return $false }
            & $sevenZip t "$tgZip" | Out-Null
            return ($LASTEXITCODE -eq 0)
          }
          function Resolve-GitHubTg {
            try {
              $rel = Invoke-RestMethod "https://api.github.com/repos/telegramdesktop/tdesktop/releases/latest" -Headers @{ "User-Agent" = "Mozilla/5.0" }
              $asset = $rel.assets | Where-Object { $_.name -like "tportable-x64*.zip" } | Select-Object -First 1
              if ($asset) { return @{ Url = $asset.browser_download_url; Size = [int64]$asset.size } }
              Write-Host "GitHub API answered but no tportable-x64 asset found"
            } catch { Write-Host "GitHub API lookup failed - trying HTML page" }
            try {
              $eff = curl.exe -L -f -s -o NUL -w "%{url_effective}" --connect-timeout 20 --max-time 60 "https://github.com/telegramdesktop/tdesktop/releases/latest"
              $tag = (($eff -split '/')[-1]).Trim()
              if ($tag) {
                $frag = curl.exe -L -f -s --connect-timeout 20 --max-time 60 "https://github.com/telegramdesktop/tdesktop/releases/expanded_assets/$tag"
                $mm = [regex]::Match(($frag -join "`n"), "href=`"(/telegramdesktop/tdesktop/releases/download/[^`"]+?/tportable-x64[^`"]*?\.zip)`"")
                if ($mm.Success) { return @{ Url = ("https://github.com" + $mm.Groups[1].Value); Size = 0 } }
              }
              Write-Host "GitHub HTML lookup found no asset link"
            } catch { Write-Host "GitHub HTML lookup failed" }
            return $null
          }
          $gh = Resolve-GitHubTg
          $sources = @()
          if ($gh) { $sources += @{ Name = "GitHub"; Url = $gh.Url; Size = $gh.Size; MaxTime = 120 } }
          $sources += @{ Name = "telegram.org"; Url = "https://telegram.org/dl/desktop/win64_portable"; Size = 0; MaxTime = 300 }
          if ($gh) { $sources += @{ Name = "GitHub round 2"; Url = $gh.Url; Size = $gh.Size; MaxTime = 120 } }
          $tgOk = $false
          foreach ($src in $sources) {
            Remove-Item "$tgZip" -Force -ErrorAction SilentlyContinue
            Write-Host ("Downloading Telegram portable from " + $src.Name + " ...")
            curl.exe -L -f -s --connect-timeout 20 --max-time $src.MaxTime --retry 1 $src.Url -o "$tgZip"
            if (Test-Path $tgZip) { Write-Host ("Downloaded: " + [math]::Round((Get-Item $tgZip).Length / 1MB, 1) + " MB") }
            if (($src.Size -gt 0) -and (Test-Path $tgZip) -and ((Get-Item $tgZip).Length -ne $src.Size)) {
              Write-Host "Size mismatch vs the GitHub asset - rejecting this download"
              continue
            }
            if (Test-TgZip) { $tgOk = $true; Write-Host "Zip integrity OK"; break }
            Write-Host "Zip incomplete or corrupt - trying next source"
          }
          if ($tgOk) {
            New-Item -ItemType Directory -Force -Path "C:\Apps" | Out-Null
            & $sevenZip x "$tgZip" -o"C:\Apps" -y | Out-Null
            $global:LASTEXITCODE = 0
          } else {
            Write-Host "WARNING: Telegram download failed on all sources"
          }
          if ((Test-Path "C:\Apps\Telegram\Telegram.exe") -and ((Get-Item "C:\Apps\Telegram\Telegram.exe").Length -gt 100MB)) {
            New-DeskShortcut "C:\Apps\Telegram\Telegram.exe" "Telegram Desktop"
            Write-Host "Telegram OK (portable at C:\Apps\Telegram)"
          } else {
            Write-Host "WARNING: Telegram.exe missing or suspiciously small after extraction"
          }
          $global:LASTEXITCODE = 0

      - name: Install TeraBox Desktop
        shell: powershell
        continue-on-error: true
        timeout-minutes: 12
        run: |
          function New-DeskShortcut($exe, $name) {
            foreach ($desk in @("C:\Users\Public\Desktop", "C:\Users\$env:RDP_USER\Desktop")) {
              if (Test-Path $desk) {
                $s = New-Object -ComObject WScript.Shell
                $lnk = $s.CreateShortcut("$desk\$name.lnk")
                $lnk.TargetPath = $exe
                $lnk.Save()
                Write-Host "Shortcut created: $desk\$name.lnk"
              }
            }
          }
          function Find-TeraBox {
            $cands = @(
              "C:\Program Files\TeraBox\TeraBox.exe",
              "C:\Program Files (x86)\TeraBox\TeraBox.exe",
              "$env:APPDATA\TeraBox\TeraBox.exe",
              "C:\Users\runneradmin\AppData\Roaming\TeraBox\TeraBox.exe",
              "$env:LOCALAPPDATA\TeraBox\TeraBox.exe",
              "C:\Users\runneradmin\AppData\Local\TeraBox\TeraBox.exe",
              "C:\Users\runneradmin\AppData\Local\Programs\TeraBox\TeraBox.exe"
            )
            $hit = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($hit) { return $hit }
            return (Get-ChildItem "C:\Users\runneradmin\AppData", "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter "TeraBox.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $tbExe = $null

          # ---------- Method 1: official direct installer (no winget at all) ----------
          Write-Host "Method 1: TeraBox official direct installer..."
          $tbUrl = $null
          try {
            $page = curl.exe -L -f -s --connect-timeout 20 --max-time 60 "https://www.terabox.com/terabox-cloud-storage-for-pc-free-download"
            $m = [regex]::Match(($page -join "`n"), "https://data\.nephobox\.com/[^\s""']+?\.exe")
            if ($m.Success) { $tbUrl = $m.Value; Write-Host "Live installer URL from terabox.com: $tbUrl" }
          } catch { Write-Host "Could not read terabox.com download page" }
          if (-not $tbUrl) {
            $tbUrl = "https://data.nephobox.com/issue/terabox/PCTeraBox/Terabox_1.49.5.183.exe"
            Write-Host "Using pinned installer URL: $tbUrl"
          }
          $tbSetup = "$env:TEMP\TeraBoxSetup.exe"
          curl.exe -L -f -s --connect-timeout 20 --max-time 300 --retry 2 "$tbUrl" -o "$tbSetup"
          if ((Test-Path $tbSetup) -and ((Get-Item $tbSetup).Length -gt 30MB)) {
            Write-Host ("Installer downloaded: " + [math]::Round((Get-Item $tbSetup).Length / 1MB, 1) + " MB - installing silently (/S)...")
            $p = Start-Process "$tbSetup" -ArgumentList "/S" -PassThru
            # WAIT until the installer process has FULLY exited. v5 killed it the
            # moment TeraBox.exe appeared, so its resource files were never written
            # and the app later failed with "application resource file is missing".
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 5
              if ($p.HasExited) { break }
            }
            if (-not $p.HasExited) { Write-Host "Installer still running after 300s - stopping it"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 10
            $tbExe = Find-TeraBox
            # Manual fallback: keep the installer at a fixed path + a desktop
            # shortcut, so it can be re-run by hand inside the RDP session.
            New-Item -ItemType Directory -Force -Path "C:\Apps" | Out-Null
            Copy-Item "$tbSetup" "C:\Apps\TeraBoxSetup.exe" -Force -ErrorAction SilentlyContinue
            New-DeskShortcut "C:\Apps\TeraBoxSetup.exe" "TeraBox Setup"
          } else {
            Write-Host "WARNING: TeraBox installer download failed or too small"
          }

          # ---------- Method 2: winget WITH its license file ----------
          # v4 installed winget with Add-AppxPackage only, so it refused to run:
          # "No applicable app licenses found". The license XML from the same
          # GitHub release must be injected with Add-AppxProvisionedPackage.
          if (-not $tbExe) {
            Write-Host "Method 2: winget with license provisioning..."
            curl.exe -L -f -s --connect-timeout 20 --max-time 180 --retry 2 "https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx" -o "$env:TEMP\vclibs.appx"
            Add-AppxPackage "$env:TEMP\vclibs.appx" -ErrorAction SilentlyContinue
            curl.exe -L -f -s --connect-timeout 20 --max-time 180 --retry 2 "https://github.com/microsoft/microsoft-ui-xaml/releases/download/v2.8.6/Microsoft.UI.Xaml.2.8.x64.appx" -o "$env:TEMP\uixaml.appx"
            Add-AppxPackage "$env:TEMP\uixaml.appx" -ErrorAction SilentlyContinue
            try {
              $rel = Invoke-RestMethod "https://api.github.com/repos/microsoft/winget-cli/releases/tags/v1.8.1911" -Headers @{ "User-Agent" = "Mozilla/5.0" }
              $bundleAsset = $rel.assets | Where-Object { $_.name -like "*.msixbundle" } | Select-Object -First 1
              $licAsset = $rel.assets | Where-Object { $_.name -like "*License1.xml" } | Select-Object -First 1
              if ($bundleAsset) { curl.exe -L -f -s --connect-timeout 20 --max-time 180 --retry 1 $bundleAsset.browser_download_url -o "$env:TEMP\winget.msixbundle" }
              if ($licAsset) { curl.exe -L -f -s --connect-timeout 20 --max-time 60 --retry 1 $licAsset.browser_download_url -o "$env:TEMP\winget-license.xml"; Write-Host ("License file: " + $licAsset.name) }
            } catch { Write-Host "winget release lookup failed" }
            if (Test-Path "$env:TEMP\winget.msixbundle") {
              Add-AppxPackage "$env:TEMP\winget.msixbundle" -ErrorAction SilentlyContinue
              if (Test-Path "$env:TEMP\winget-license.xml") {
                try {
                  Add-AppxProvisionedPackage -Online -PackagePath "$env:TEMP\winget.msixbundle" -LicensePath "$env:TEMP\winget-license.xml" -ErrorAction Stop | Out-Null
                  Write-Host "winget provisioned WITH license"
                } catch { Write-Host "Provisioning failed" }
              }
            }
            $wg = Get-ChildItem "C:\Program Files\WindowsApps" -Recurse -Filter winget.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if ($wg) {
              $ver = & $wg --version 2>$null
              Write-Host "winget smoke test: $ver"
              if ($ver) {
                & $wg install --id Flextech.TeraBox -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
                $tbExe = Find-TeraBox
              } else {
                Write-Host "WARNING: winget still refuses to run (license)"
              }
            } else {
              Write-Host "WARNING: winget.exe not found after install"
            }
          }

          # ---------- Finish: one machine-wide location + shortcuts ----------
          if ($tbExe) {
            if ($tbExe -like "*AppData*") {
              $srcDir = Split-Path $tbExe
              $dstDir = "C:\Program Files\TeraBox"
              # The installer may auto-launch TeraBox; a running instance locks
              # files and robocopy then silently skips one (v6 copied 189 of 190).
              Stop-Process -Name "TeraBox" -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
              Write-Host "TeraBox installed per-user at $tbExe - mirroring program folder to Program Files (robocopy)..."
              robocopy "$srcDir" "$dstDir" /E /R:2 /W:2 /NFL /NDL /NJH /NJS | Out-Null
              $global:LASTEXITCODE = 0
              $missing = Get-ChildItem "$srcDir" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($srcDir.Length) } | Where-Object { -not (Test-Path ($dstDir + $_)) }
              if ($missing) {
                Write-Host ("Missing after first copy: " + ($missing -join ", ") + " - copying again...")
                robocopy "$srcDir" "$dstDir" /E /R:2 /W:2 /NFL /NDL /NJH /NJS | Out-Null
                $global:LASTEXITCODE = 0
                $missing = Get-ChildItem "$srcDir" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($srcDir.Length) } | Where-Object { -not (Test-Path ($dstDir + $_)) }
              }
              $srcCount = (Get-ChildItem "$srcDir" -Recurse -File -ErrorAction SilentlyContinue).Count
              $dstCount = (Get-ChildItem "$dstDir" -Recurse -File -ErrorAction SilentlyContinue).Count
              Write-Host "TeraBox folder file count - source: $srcCount | Program Files copy: $dstCount"
              if ($missing) { Write-Host ("STILL MISSING: " + ($missing -join ", ")) } else { Write-Host "TeraBox copy complete - no missing files" }
              if (Test-Path "$dstDir\TeraBox.exe") { $tbExe = "$dstDir\TeraBox.exe" }
            }
            New-DeskShortcut $tbExe "TeraBox"
            Write-Host "TeraBox OK - $tbExe"
          } else {
            Write-Host "WARNING: TeraBox.exe not found after BOTH methods"
          }
          $global:LASTEXITCODE = 0

      - name: Verify Desktop shortcuts
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "=== Public Desktop contents ==="
          Get-ChildItem "C:\Users\Public\Desktop" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "=== Installed check ==="
          Write-Host ("WinRAR:   " + (Test-Path "C:\Program Files\WinRAR\WinRAR.exe"))
          Write-Host ("Telegram: " + (Test-Path "C:\Apps\Telegram\Telegram.exe"))
          Write-Host ("TeraBox:  " + ((Test-Path "C:\Program Files\TeraBox\TeraBox.exe") -or (Test-Path "C:\Users\Public\Desktop\TeraBox.lnk")))

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="$env:TS_HOSTNAME" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 8
          $tsStatus = & $ts status
          if ($tsStatus) { Write-Host "Tailscale is connected (IP and peer details hidden in v9)" } else { Write-Host "WARNING: tailscale status returned nothing" }

      - name: Test RDP availability
        shell: powershell
        run: |
          $result = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
          if (-not $result.TcpTestSucceeded) { throw "RDP port 3389 is NOT open." }

      - name: Show RDP information
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          if (-not [string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
            try { Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body "RDP Ready (B) - Tailscale IP: $ip - User: $env:RDP_USER - Host: $env:TS_HOSTNAME" | Out-Null } catch { Write-Host "WARNING: webhook notify failed" }
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "### Windows RDP via Tailscale (B)"
          Add-Content $env:GITHUB_STEP_SUMMARY "Tailscale IP: (sent privately via webhook - hidden in v9)"
          Add-Content $env:GITHUB_STEP_SUMMARY "Hostname: **$env:TS_HOSTNAME**"
          Add-Content $env:GITHUB_STEP_SUMMARY "RDP User: **$env:RDP_USER**"
          Add-Content $env:GITHUB_STEP_SUMMARY "Loops remaining: **${{ inputs.loops }}**"
          Add-Content $env:GITHUB_STEP_SUMMARY "Auto Backup Enabled: **${{ inputs.enable_backup }}**"

      - name: Keep RDP alive
        shell: powershell
        continue-on-error: true
        run: |
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ($runtime -lt 1 -or $runtime -gt 300) { $runtime = 300 }
          # v8: v7 counted $runtime from THIS step, so installs (~10-35 min)
          # pushed the total past the 360-min job timeout and GitHub killed
          # the job before backup/upload/Start-B ever ran -> red run, no A->B.
          # Now the clock starts at JOB start, leaving ~25 min for the ending steps.
          $startFile = "C:\job_start.txt"
          if (Test-Path $startFile) { $jobStart = [datetime](Get-Content $startFile -Raw) } else { $jobStart = Get-Date }
          $end = $jobStart.AddMinutes($runtime)
          $hardEnd = $jobStart.AddMinutes(300)
          if ($end -gt $hardEnd) { $end = $hardEnd }
          Write-Host "Job started: $jobStart - RDP alive until: $end (hard cap 300 min from job start)"
          while ((Get-Date) -lt $end) {
            Write-Host "$(Get-Date) - RDP is alive"
            Start-Sleep -Seconds 30
          }

      - name: Auto Backup Work before Shutdown
        if: ${{ always() && inputs.enable_backup == 'true' }}
        shell: powershell
        env:
          BACKUP_PASS: ${{ secrets.BACKUP_PASS }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BACKUP_PASS)) { Write-Host "ERROR: BACKUP_PASS secret is not set - backup SKIPPED (v9 never uploads unencrypted)"; Add-Content $env:GITHUB_STEP_SUMMARY "Backup SKIPPED: BACKUP_PASS secret is missing"; exit 0 }
          $ArchivePath = "C:\backup_output.7z"
          $UserFolders = Get-ChildItem -Path "C:\Users" -Directory | Where-Object { $_.Name -like "Bullettemporary*" }
          $PathsToBackup = @()
          foreach ($u in $UserFolders) {
            foreach ($f in @("Downloads", "Desktop", "Documents")) {
              if (Test-Path "$($u.FullName)\$f") { $PathsToBackup += "$($u.FullName)\$f" }
            }
          }
          $backupFileCount = 0
          foreach ($p in $PathsToBackup) {
            $backupFileCount += (Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          }
          Write-Host "Files that will be backed up: $backupFileCount"
          Add-Content $env:GITHUB_STEP_SUMMARY "### Files backed up"
          Add-Content $env:GITHUB_STEP_SUMMARY "$backupFileCount files (names hidden in v9)"
          if ($PathsToBackup.Count -gt 0) {
            Set-Location "C:\Users"
            $RelativePaths = $PathsToBackup | ForEach-Object { $_.Replace("C:\Users\", "") }
            & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx0 -ssw -mhe=on -p"$env:BACKUP_PASS" "$ArchivePath" $RelativePaths
            $global:LASTEXITCODE = 0  # v8: 7z exit 1 = warnings (locked files); must not fail the step
            if (Test-Path $ArchivePath) {
              $SizeMB = [math]::Round((Get-Item $ArchivePath).Length / 1MB, 2)
              Write-Host "Backup created (encrypted): $SizeMB MB"
              Add-Content $env:GITHUB_STEP_SUMMARY "Encrypted backup ready: $SizeMB MB (transferred as artifact)"
              if (-not [string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
                try { Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body "Backup Complete (B) - $SizeMB MB - encrypted, transferred as artifact" | Out-Null } catch { Write-Host "WARNING: webhook notify failed" }
              }
            }
          } else {
            Write-Host "WARNING: no user folders found to back up"
          }

      - name: Upload Artifact for Next Session Transfer
        if: ${{ always() && inputs.enable_backup == 'true' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: session-backup
          path: C:\backup_output.7z
          retention-days: 1

      - name: Start workflow A or stop
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $loops = [int]"${{ inputs.loops }}"
          if ($loops -le 1) { exit 0 }
          $nextLoops = $loops - 1
          
          $body = @{
            ref = "main"
            inputs = @{
              test_mode = "${{ inputs.test_mode }}"
              runtime_minutes = "${{ inputs.runtime_minutes }}"
              loops = "$nextLoops"
              enable_backup = "${{ inputs.enable_backup }}"
              prev_run_id = "${{ github.run_id }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Method POST `
            -Uri "https://api.github.com/repos/$repo/actions/workflows/windows-rdp-tailscale-A.yml/dispatches" `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -Body $body `
            -ContentType "application/json"
