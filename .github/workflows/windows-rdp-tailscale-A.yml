name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode"
        required: false
        default: "false"

      runtime_minutes:
        description: "Runtime in minutes"
        required: false
        default: "335"

      loops:
        description: "Number of A+B cycles"
        required: false
        default: "2"

      enable_backup:
        description: "Enable Auto Backup & Restore"
        type: choice
        options:
          - "true"
          - "false"
        required: false
        default: "true"

      prev_run_id:
        description: "Previous Run ID for automatic restore (Leave empty)"
        required: false
        default: ""

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  RDP_USER: Bullettemporary
  TS_HOSTNAME: bullet
  WEBHOOK_URL: "https://webhook.site/077f724d-3069-414b-ada8-c6255c34cbca"

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:

      - name: Validate Secrets
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) { throw "Missing RDP_PASS secret" }
          if ([string]::IsNullOrWhiteSpace($env:TS_API_KEY)) { throw "Missing TS_API_KEY secret" }
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) { throw "Missing TS_AUTHKEY secret" }
          if ([string]::IsNullOrWhiteSpace($env:GH_API_TOKEN)) { throw "Missing GH_API_TOKEN secret" }

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe"
          $installer = "$env:TEMP\tailscale-setup.exe"
          curl.exe -L --retry 5 --retry-delay 3 -s "$url" -o "$installer"
          Start-Process -FilePath "$installer" -ArgumentList "/quiet" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: Configure Windows RDP
        shell: powershell
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          $user = $env:RDP_USER
          $pass = $env:RDP_PASS
          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue
          if ($existing) {
            Set-LocalUser -Name $user -Password $secure
          } else {
            New-LocalUser -Name $user -Password $secure -PasswordNeverExpires -UserMayNotChangePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service TermService -Force

      - name: Install Default Apps (WinRAR, Telegram, TeraBox)
        shell: powershell
        continue-on-error: true
        run: |
          $PublicDesktop = "C:\Users\Public\Desktop"
          $WshShell = New-Object -ComObject WScript.Shell

          Write-Host "1. Installing WinRAR..."
          choco install winrar -y --no-progress
          if (Test-Path "C:\Program Files\WinRAR\WinRAR.exe") {
            $Shortcut = $WshShell.CreateShortcut("$PublicDesktop\WinRAR.lnk")
            $Shortcut.TargetPath = "C:\Program Files\WinRAR\WinRAR.exe"
            $Shortcut.Save()
          }

          Write-Host "2. Installing Telegram Desktop..."
          $tgZip = "$env:TEMP\tg_portable.zip"
          curl.exe -L -s "https://telegram.org/dl/desktop/win64_portable" -o "$tgZip"
          & "C:\Program Files\7-Zip\7z.exe" x "$tgZip" -o"C:\TelegramApp" -y
          if (Test-Path "C:\TelegramApp\Telegram\Telegram.exe") {
            $Shortcut = $WshShell.CreateShortcut("$PublicDesktop\Telegram Desktop.lnk")
            $Shortcut.TargetPath = "C:\TelegramApp\Telegram\Telegram.exe"
            $Shortcut.Save()
          }

          Write-Host "3. Downloading TeraBox..."
          $yamlUrl = "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/f/Flextech/TeraBox/1.38.0/Flextech.TeraBox.installer.yaml"
          $yaml = Invoke-RestMethod -Uri $yamlUrl -ErrorAction SilentlyContinue
          $dlUrl = [regex]::Match($yaml, 'InstallerUrl:\s*(https://[^\s]+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($dlUrl)) {
            $dlUrl = "https://data.nephobox.com/issue/terabox/PCDownload/TeraBox_1.38.0.exe"
          }
          $tbInstaller = "$PublicDesktop\TeraBox_Setup.exe"
          curl.exe -L -s "$dlUrl" -H "Referer: https://www.terabox.com/" -A "Mozilla/5.0" -o "$tbInstaller"
          if (Test-Path $tbInstaller) {
            & "C:\Program Files\7-Zip\7z.exe" x "$tbInstaller" -o"C:\TeraBoxApp" -y
            if (Test-Path "C:\TeraBoxApp\TeraBox.exe") {
              $Shortcut = $WshShell.CreateShortcut("$PublicDesktop\TeraBox.lnk")
              $Shortcut.TargetPath = "C:\TeraBoxApp\TeraBox.exe"
              $Shortcut.Save()
            }
          }
          exit 0

      - name: Download Backup from Previous Session
        if: ${{ inputs.enable_backup == 'true' && inputs.prev_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: session-backup
          path: C:\RestoredBackup
          github-token: ${{ secrets.GH_API_TOKEN }}
          run-id: ${{ inputs.prev_run_id }}

      - name: Extract Restored Files to User Profile
        if: ${{ inputs.enable_backup == 'true' && inputs.prev_run_id != '' }}
        shell: powershell
        run: |
          if (Test-Path "C:\RestoredBackup\backup_output.zip") {
            & "C:\Program Files\7-Zip\7z.exe" x "C:\RestoredBackup\backup_output.zip" -o"C:\Users" -y
            Write-Host "Files restored successfully to C:\Users!"
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="$env:TS_HOSTNAME" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 8
          & $ts status
          & $ts ip -4

      - name: Test RDP availability
        shell: powershell
        run: |
          $result = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
          if (-not $result.TcpTestSucceeded) { throw "RDP port 3389 is NOT open." }

      - name: Show RDP information
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ipList = & $ts ip -4
          $ip = "$ipList".Trim()
          Add-Content $env:GITHUB_STEP_SUMMARY "### Windows RDP via Tailscale (A)"
          Add-Content $env:GITHUB_STEP_SUMMARY "Tailscale IP: **$ip**"
          Add-Content $env:GITHUB_STEP_SUMMARY "Hostname: **$env:TS_HOSTNAME**"
          Add-Content $env:GITHUB_STEP_SUMMARY "RDP User: **$env:RDP_USER**"
          Add-Content $env:GITHUB_STEP_SUMMARY "Loops remaining: **${{ inputs.loops }}**"
          Add-Content $env:GITHUB_STEP_SUMMARY "Auto Backup Enabled: **${{ inputs.enable_backup }}**"

      - name: Keep RDP alive
        shell: powershell
        continue-on-error: true
        run: |
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ($runtime -lt 1) { $runtime = 335 }
          if ($runtime -gt 335) { $runtime = 335 }
          $end = (Get-Date).AddMinutes($runtime)
          while ((Get-Date) -lt $end) {
            Write-Host "$(Get-Date) - RDP is alive"
            Start-Sleep -Seconds 30
          }

      - name: Auto Backup Work before Shutdown
        if: ${{ always() && inputs.enable_backup == 'true' }}
        shell: powershell
        continue-on-error: true
        run: |
          $ArchivePath = "C:\backup_output.zip"
          Set-Location "C:\Users"
          
          # ضغط مجلدات المستخدم مباشرة بدون حلقات معقدة أو رموز قد تتشوه
          & "C:\Program Files\7-Zip\7z.exe" a -tzip -mx1 -ssw "$ArchivePath" "Bullettemporary*\Desktop" "Bullettemporary*\Downloads"
          
          if (Test-Path $ArchivePath) {
            $FileItem = Get-Item $ArchivePath
            $SizeMB = [math]::Round($FileItem.Length / 1MB, 2)
            $ServerResp = Invoke-RestMethod -Uri "https://api.gofile.io/servers"
            $Server = $ServerResp.data.servers[0].name
            $RespRaw = curl.exe -s -F "file=@$ArchivePath" "https://$Server.gofile.io/contents/uploadfile"
            $RespJson = ConvertFrom-Json $RespRaw
            $GoFileLink = $RespJson.data.downloadPage
            
            $Msg = "✅ [Workflow A] Backup Complete ($SizeMB MB) - GoFile Link: $GoFileLink"
            Write-Host $Msg
            Add-Content $env:GITHUB_STEP_SUMMARY "**GoFile Link:** $GoFileLink ($SizeMB MB)"
            
            if (-not [string]::IsNullOrWhiteSpace($env:WEBHOOK_URL)) {
              Invoke-RestMethod -Uri $env:WEBHOOK_URL -Method Post -Body $Msg
            }
          }

      - name: Upload Artifact for Next Session Transfer
        if: ${{ always() && inputs.enable_backup == 'true' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: session-backup
          path: C:\backup_output.zip
          retention-days: 1

      - name: Start workflow B
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          $repo = "${{ github.repository }}"
          $loops = [int]"${{ inputs.loops }}"
          if ($loops -lt 1) { exit 0 }
          
          $payload = @{
            ref = "main"
            inputs = @{
              test_mode = "${{ inputs.test_mode }}"
              runtime_minutes = "${{ inputs.runtime_minutes }}"
              loops = "$loops"
              enable_backup = "${{ inputs.enable_backup }}"
              prev_run_id = "${{ github.run_id }}"
            }
          }
          $body = ConvertTo-Json $payload -Depth 5

          Invoke-RestMethod `
            -Method POST `
            -Uri "https://api.github.com/repos/$repo/actions/workflows/windows-rdp-tailscale-B.yml/dispatches" `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -Body $body `
            -ContentType "application/json"
